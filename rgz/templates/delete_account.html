{% extends "base.html" %}
{% block content %}
<h2>Удаление аккаунта</h2>
<p style="color: red; font-weight: bold;">
    Внимание! Это действие нельзя отменить. Все ваши операции будут безвозвратно удалены.
</p>
<form method="POST" onsubmit="return confirm('Вы действительно хотите удалить свой аккаунт?');">
    <button type="submit" style="background-color: #dc3545; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer;">
        Подтвердить удаление
    </button>
    <a href="{{ url_for('view_operations') }}" style="margin-left: 10px; text-decoration: none;">Отмена</a>
</form>
{% endblock %}
