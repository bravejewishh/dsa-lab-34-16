<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Добавить валюту</title>
    <style>
        .form-group { margin-bottom: 15px; }
        label { width: 120px; display: inline-block; }
        input { padding: 5px; width: 200px; }
        button { padding: 8px 20px; background-color: #28a745; color: white; border: none; cursor: pointer; }
        .message { margin-top: 20px; padding: 10px; }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h2>Добавление валюты</h2>
    <form id="addForm">
        <div class="form-group">
            <label>Код валюты:</label>
            <input type="text" id="currency_name" placeholder="USD, EUR" required>
        </div>
        <div class="form-group">
            <label>Курс к рублю:</label>
            <input type="number" id="rate" step="any" required>
        </div>
        <button type="submit">Добавить</button>
    </form>
    <div id="message"></div>
    <a href="/">← На главную</a>
    <script>
        document.getElementById('addForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const currency_name = document.getElementById('currency_name').value.toUpperCase();
            const rate = parseFloat(document.getElementById('rate').value);
            const resp = await fetch('/api/load', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({currency_name, rate})
            });
            const result = await resp.json();
            const msgDiv = document.getElementById('message');
            if (resp.ok) {
                msgDiv.innerHTML = `<div class="message success">${result.message}</div>`;
                document.getElementById('addForm').reset();
            } else {
                msgDiv.innerHTML = `<div class="message error">${result.error}</div>`;
            }
        });
    </script>
</body>
</html>
