<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Обновить курс</title>
    <style>
        .form-group { margin-bottom: 15px; }
        label { width: 120px; display: inline-block; }
        input { padding: 5px; width: 200px; }
        button { padding: 8px 20px; background-color: #ffc107; border: none; cursor: pointer; }
        .success { background-color: #d4edda; color: #155724; padding: 10px; margin-top: 20px; }
        .error { background-color: #f8d7da; color: #721c24; padding: 10px; margin-top: 20px; }
    </style>
</head>
<body>
    <h2>Обновление курса</h2>
    <form id="updateForm">
        <div class="form-group">
            <label>Код валюты:</label>
            <input type="text" id="currency_name" placeholder="USD" required>
        </div>
        <div class="form-group">
            <label>Новый курс:</label>
            <input type="number" id="rate" step="any" required>
        </div>
        <button type="submit">Обновить</button>
    </form>
    <div id="message"></div>
    <a href="/">← На главную</a>
    <script>
        document.getElementById('updateForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const currency_name = document.getElementById('currency_name').value.toUpperCase();
            const rate = parseFloat(document.getElementById('rate').value);
            const resp = await fetch('/api/update', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({currency_name, rate})
            });
            const result = await resp.json();
            const msgDiv = document.getElementById('message');
            if (resp.ok) {
                msgDiv.innerHTML = `<div class="success">${result.message}</div>`;
                document.getElementById('updateForm').reset();
            } else {
                msgDiv.innerHTML = `<div class="error">${result.error}</div>`;
            }
        });
    </script>
</body>
</html>
